query GetModel($brandId: ID!, $modelId: ID!) {
  findUniqueModel(brandId: $brandId, modelId: $modelId) {
    id
    name
    type
    image
    price
    description
    specs {
      bodyWood
      neckWood
      fingerboardWood
      bridge
      pickups
      scaleLength
      tuners
    }
    musicians {
      name
      musicianImage
      bands
    }
  }
}
